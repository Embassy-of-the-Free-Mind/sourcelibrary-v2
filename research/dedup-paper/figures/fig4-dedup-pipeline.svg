<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="Georgia, 'Times New Roman', serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
    <style>
      .step-box { fill: #f8f9fa; stroke: #333; stroke-width: 1.5; rx: 5; }
      .step-label { font-weight: bold; font-size: 13px; }
      .detail-box { fill: #f0f4f8; stroke: #2563eb; stroke-width: 1.2; rx: 4; }
      .formula { font-family: 'Courier New', monospace; font-size: 12px; fill: #1a1a1a; }
      .result-box { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.5; rx: 5; }
      .note { font-size: 10px; fill: #888; font-style: italic; }
    </style>
  </defs>

  <!-- Step 1: Input -->
  <rect x="20" y="30" width="140" height="60" class="step-box"/>
  <text x="90" y="55" text-anchor="middle" class="step-label">828K records</text>
  <text x="90" y="75" text-anchor="middle" class="note">all sources combined</text>

  <!-- Arrow -->
  <line x1="160" y1="60" x2="200" y2="60" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2: Blocking -->
  <rect x="210" y="20" width="180" height="80" class="step-box"/>
  <text x="300" y="42" text-anchor="middle" class="step-label">Blocking</text>
  <text x="300" y="62" text-anchor="middle" font-size="11" fill="#444">Group by</text>
  <text x="300" y="78" text-anchor="middle" class="formula">decade + author[0:4]</text>
  <text x="300" y="92" text-anchor="middle" class="note">reduces 343B pairs → 18M</text>

  <!-- Arrow -->
  <line x1="390" y1="60" x2="430" y2="60" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3: Blocks -->
  <rect x="440" y="20" width="160" height="80" class="step-box"/>
  <text x="520" y="42" text-anchor="middle" class="step-label">57K blocks</text>
  <text x="520" y="62" text-anchor="middle" font-size="11" fill="#444">avg 14.5 records each</text>
  <text x="520" y="78" text-anchor="middle" class="note">blocks &gt; 500 skipped</text>

  <!-- Arrow down -->
  <line x1="520" y1="100" x2="520" y2="140" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4: Comparison (main detail box) -->
  <rect x="100" y="150" width="580" height="160" class="detail-box"/>
  <text x="390" y="175" text-anchor="middle" class="step-label" fill="#2563eb">Pairwise Comparison (within each block)</text>

  <!-- Three comparison fields -->
  <rect x="120" y="195" width="170" height="70" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
  <text x="205" y="215" text-anchor="middle" font-weight="bold" font-size="12">Title similarity</text>
  <text x="205" y="233" text-anchor="middle" class="formula">Jaro-Winkler(t₁, t₂)</text>
  <text x="205" y="251" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="bold">weight: 0.55</text>

  <rect x="310" y="195" width="170" height="70" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
  <text x="395" y="215" text-anchor="middle" font-weight="bold" font-size="12">Author similarity</text>
  <text x="395" y="233" text-anchor="middle" class="formula">Jaro-Winkler(a₁, a₂)</text>
  <text x="395" y="251" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="bold">weight: 0.30</text>

  <rect x="500" y="195" width="160" height="70" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
  <text x="580" y="215" text-anchor="middle" font-weight="bold" font-size="12">Date match</text>
  <text x="580" y="233" text-anchor="middle" class="formula">exact=1.0  ±2yr=0.9</text>
  <text x="580" y="251" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="bold">weight: 0.15</text>

  <!-- Composite formula -->
  <text x="390" y="290" text-anchor="middle" class="formula" font-size="13">
    score = title × 0.55 + author × 0.30 + date × 0.15
  </text>

  <!-- Arrow with threshold -->
  <line x1="390" y1="310" x2="390" y2="355" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="335" y="325" width="110" height="22" fill="#fff" stroke="#c62828" stroke-width="1" rx="3"/>
  <text x="390" y="341" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold">score ≥ 0.85?</text>

  <!-- Step 5: Clustering -->
  <rect x="240" y="365" width="170" height="55" class="step-box"/>
  <text x="325" y="387" text-anchor="middle" class="step-label">Union-Find</text>
  <text x="325" y="407" text-anchor="middle" font-size="11" fill="#444">if A≈B and B≈C → {A,B,C}</text>

  <!-- Arrow to result -->
  <line x1="410" y1="392" x2="460" y2="392" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Result -->
  <rect x="470" y="365" width="200" height="55" class="result-box"/>
  <text x="570" y="387" text-anchor="middle" font-weight="bold" font-size="14" fill="#2e7d32">665K unique</text>
  <text x="570" y="407" text-anchor="middle" font-size="11" fill="#666">73K clusters identified</text>

  <!-- Caption -->
  <text x="390" y="438" text-anchor="middle" font-size="11" fill="#666" font-style="italic">
    Figure 4. Blocking, pairwise comparison, and union-find clustering pipeline.
  </text>
</svg>
