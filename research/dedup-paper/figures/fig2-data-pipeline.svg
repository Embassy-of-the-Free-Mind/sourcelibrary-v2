<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="Georgia, 'Times New Roman', serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
    <style>
      .source-box { fill: #f8f9fa; stroke: #333; stroke-width: 1.5; rx: 5; }
      .source-name { font-weight: bold; font-size: 13px; fill: #1a1a1a; }
      .source-count { font-size: 16px; font-weight: bold; fill: #2563eb; }
      .source-api { font-size: 10px; fill: #888; font-family: 'Courier New', monospace; }
      .central-box { fill: #2563eb; stroke: none; rx: 6; }
      .central-text { fill: white; font-weight: bold; }
      .schema-text { fill: rgba(255,255,255,0.85); font-size: 10px; font-family: 'Courier New', monospace; }
      .process-box { fill: #f0f4f8; stroke: #2563eb; stroke-width: 1.5; rx: 5; }
      .result-box { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.5; rx: 5; }
    </style>
  </defs>

  <!-- Source boxes -->
  <!-- BSB -->
  <rect x="20" y="20" width="150" height="100" class="source-box"/>
  <text x="95" y="45" text-anchor="middle" class="source-name">BSB Munich</text>
  <text x="95" y="72" text-anchor="middle" class="source-count">432,113</text>
  <text x="95" y="92" text-anchor="middle" class="source-api">OAI-PMH (VD16/17/18)</text>
  <text x="95" y="106" text-anchor="middle" font-size="10" fill="#888">German, Latin</text>

  <!-- e-rara -->
  <rect x="190" y="20" width="150" height="100" class="source-box"/>
  <text x="265" y="45" text-anchor="middle" class="source-name">e-rara</text>
  <text x="265" y="72" text-anchor="middle" class="source-count">160,639</text>
  <text x="265" y="92" text-anchor="middle" class="source-api">OAI-PMH (Dublin Core)</text>
  <text x="265" y="106" text-anchor="middle" font-size="10" fill="#888">German, Latin, French</text>

  <!-- Gallica -->
  <rect x="360" y="20" width="150" height="100" class="source-box"/>
  <text x="435" y="45" text-anchor="middle" class="source-name">Gallica (BnF)</text>
  <text x="435" y="72" text-anchor="middle" class="source-count">123,439</text>
  <text x="435" y="92" text-anchor="middle" class="source-api">SRU API</text>
  <text x="435" y="106" text-anchor="middle" font-size="10" fill="#888">French, Latin</text>

  <!-- Biblissima -->
  <rect x="530" y="20" width="150" height="100" class="source-box"/>
  <text x="605" y="45" text-anchor="middle" class="source-name">Biblissima</text>
  <text x="605" y="72" text-anchor="middle" class="source-count">111,737</text>
  <text x="605" y="92" text-anchor="middle" class="source-api">Wikibase API (P196)</text>
  <text x="605" y="106" text-anchor="middle" font-size="10" fill="#888">40+ partner libraries</text>

  <!-- Arrows down -->
  <line x1="95" y1="120" x2="95" y2="170" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="265" y1="120" x2="265" y2="170" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="435" y1="120" x2="435" y2="170" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="605" y1="120" x2="605" y2="170" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Labels on arrows -->
  <text x="95" y="153" text-anchor="middle" font-size="9" fill="#888">harvest</text>
  <text x="265" y="153" text-anchor="middle" font-size="9" fill="#888">harvest</text>
  <text x="435" y="153" text-anchor="middle" font-size="9" fill="#888">harvest</text>
  <text x="605" y="153" text-anchor="middle" font-size="9" fill="#888">sweep</text>

  <!-- Central unified catalog box -->
  <rect x="100" y="180" width="500" height="110" class="central-box"/>
  <text x="350" y="208" text-anchor="middle" class="central-text" font-size="16">Unified Catalog</text>
  <text x="350" y="230" text-anchor="middle" class="central-text" font-size="22">827,928 records</text>
  <text x="170" y="258" class="schema-text">title  author  language  date  manifest_url  source</text>
  <text x="350" y="278" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">MongoDB import_candidates collection — normalized common schema</text>

  <!-- Arrow down to dedup -->
  <line x1="350" y1="290" x2="350" y2="330" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dedup box -->
  <rect x="175" y="340" width="350" height="60" class="process-box"/>
  <text x="350" y="365" text-anchor="middle" font-weight="bold" font-size="14">Deduplication</text>
  <text x="350" y="385" text-anchor="middle" font-size="11" fill="#666">Blocking + Jaro-Winkler + Union-Find</text>

  <!-- Arrow to result -->
  <line x1="350" y1="400" x2="350" y2="435" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Reduction annotation -->
  <text x="520" y="370" font-size="11" fill="#c62828" font-style="italic">-19.7%</text>
  <text x="520" y="385" font-size="10" fill="#888">(162,780 dupes)</text>

  <!-- Result box -->
  <rect x="175" y="445" width="350" height="50" class="result-box"/>
  <text x="350" y="470" text-anchor="middle" font-weight="bold" font-size="15" fill="#2e7d32">665,148 unique digitized books</text>
  <text x="350" y="487" text-anchor="middle" font-size="10" fill="#666">Pre-modern texts across European IIIF libraries</text>

  <!-- Caption -->
  <text x="350" y="515" text-anchor="middle" font-size="11" fill="#666" font-style="italic">
    Figure 2. Data harvesting and deduplication pipeline.
  </text>
</svg>
