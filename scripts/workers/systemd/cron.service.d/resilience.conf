# cron.service drop-in for the main box (v2#4528). Install:
#   install -D -m 644 scripts/workers/systemd/cron.service.d/resilience.conf /etc/systemd/system/cron.service.d/resilience.conf
#   systemctl daemon-reload && systemctl restart cron
# Verify: systemctl show cron -p OOMPolicy -p Restart -p StartLimitIntervalUSec
#   → OOMPolicy=continue, Restart=always, StartLimitIntervalUSec=0
#
# Why: on 2026-08-31 06:41 the kernel OOM-killed `opj_decompress` children of an archiver cron job;
# with the default OOMPolicy=stop systemd then STOPPED the whole cron unit, and the stock
# Restart=on-failure did not bring it back. Every scheduled job on the box was down for 25 hours.
#  - OOMPolicy=continue: an OOM-killed cron job dies alone; the cron daemon keeps scheduling.
#  - Restart=always + StartLimitIntervalSec=0: if the daemon itself dies for any reason it comes
#    back, and a burst of restarts can never park it in "failed" for good. A deliberate
#    `systemctl stop cron` is still honoured (systemd never restarts a unit stopped by hand).
# The detector for when this is not enough is off the box: /api/cron/scheduler-liveness (Vercel).
# The 2026-09-02 handoff records a hand-made drop-in on the box (OOMPolicy=continue,
# Restart=on-failure); this file is that, checked in, with Restart=always as #4528 asked.
[Unit]
StartLimitIntervalSec=0

[Service]
OOMPolicy=continue
Restart=always
RestartSec=30s
