# self-hosted MongoDB for Source Library (#346). Managed by infrastructure/mongo-selfhost.
storage:
  dbPath: /var/lib/mongodb
  wiredTiger:
    engineConfig:
      cacheSizeGB: 12
    collectionConfig:
      blockCompressor: zstd
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  logRotate: reopen
net:
  port: 27017
  bindIp: 127.0.0.1,${PRIVATE_IP}   # the box's private-network address; never the public one
replication:
  replSetName: rs0
  oplogSizeMB: 40960
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
security:
  authorization: enabled
  keyFile: /etc/mongod.keyfile
setParameter:
  searchIndexManagementHostAndPort: 127.0.0.1:27028
  mongotHost: 127.0.0.1:27028
  useGrpcForSearch: true
