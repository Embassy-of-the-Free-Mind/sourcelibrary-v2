syncSource:
  replicaSet:
    hostAndPort: "127.0.0.1:27017"
    scramAuth:
      username: mongot
      authSource: admin
      passwordFile: "/etc/mongot/secrets/passwordFile"
    tls:
      enabled: false
storage:
  dataPath: "/var/lib/mongot"
server:
  grpc:
    address: "127.0.0.1:27028"
    tls:
      mode: "disabled"
metrics:
  enabled: true
  address: "127.0.0.1:9946"
healthCheck:
  address: "127.0.0.1:8080"
logging:
  verbosity: INFO
  logPath: "/var/log/mongot/mongot.log"
