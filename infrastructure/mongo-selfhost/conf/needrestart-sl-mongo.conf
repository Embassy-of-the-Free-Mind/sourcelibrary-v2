# /etc/needrestart/conf.d/sl-mongo.conf (#346)
# Ubuntu's unattended-upgrades runs needrestart in automatic mode: on 2026-11-17 06:16Z a libssl/zlib/systemd
# update restarted mongod, mongot, pbm-agent and both follower units on sl-db-1 by itself. In a replica set
# that is an unplanned failover on whichever member upgrades first. These services are restarted by hand,
# one member at a time (README, "Patching"); needrestart still lists them as pending.
$nrconf{override_rc}{qr(^mongod\.service$)} = 0;
$nrconf{override_rc}{qr(^mongot\.service$)} = 0;
$nrconf{override_rc}{qr(^pbm-agent\.service$)} = 0;
$nrconf{override_rc}{qr(^sl-follower-.*\.service$)} = 0;
