# /etc/systemd/system/caddy.service.d/slice.conf on cloudlayer (#6852): Caddy fronts the keyword page service, so it
# sits in that service's slice, out of the jobs' sourcelibrary.slice (search-services.slice explains why).
# l7a still uses caddy-slice.conf (sourcelibrary.slice) until its own move.
[Service]
Slice=search-services.slice
