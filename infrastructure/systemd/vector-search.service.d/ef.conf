# Search depth for the page-vector service on l7a, installed as
# /etc/systemd/system/vector-search.service.d/ef.conf (systemctl daemon-reload; systemctl restart vector-search).
# 1024 since 2026-10-18: on 38 real reader queries it returns 94.8% of the exact top-40 (worst query 0.85),
# where ef 256 returned 90.0% with two near-total misses (0.05, 0.60) and match_semantic 90.9% (worst 0.55).
# Cost: ~31 ms p50 / 100 ms p99 sequential, 269 ms p99 at 8 in parallel, inside the client's 400 ms timeout.
# Evidence: scripts/eval/experiments/2026-10-18-vector-ef-on-reader-queries-6821.md.
[Service]
Environment=VECTOR_SEARCH_EF=1024
