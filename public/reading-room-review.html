<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Room Hero — Image Review</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1612; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; height: 100vh; }

  .viewer {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .image-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .image-container img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  /* Hero preview overlay */
  .hero-preview {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, rgba(26,22,18,0.95) 0%, rgba(26,22,18,0.6) 60%, transparent 100%);
    padding: 60px 48px 32px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .hero-preview.visible { opacity: 1; }
  .hero-preview h1 { font-size: 42px; font-weight: 500; margin-bottom: 8px; font-family: Georgia, serif; }
  .hero-preview p { font-size: 15px; color: rgba(255,255,255,0.6); max-width: 520px; line-height: 1.6; }

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: #111;
    border-top: 1px solid #333;
  }

  .nav-btn {
    background: #333;
    border: none;
    color: #fff;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .nav-btn:hover { background: #444; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  .info {
    text-align: center;
    flex: 1;
  }
  .info .counter { font-size: 13px; color: #888; margin-bottom: 4px; }
  .info .label { font-size: 16px; font-weight: 600; }
  .info .source { font-size: 12px; color: #666; margin-top: 2px; }
  .info .category {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 4px;
  }
  .cat-collection { background: #2a4a2a; color: #8f8; }
  .cat-generated { background: #4a2a4a; color: #f8f; }

  .toggle-hero {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(0,0,0,0.6);
    border: 1px solid #555;
    color: #fff;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    z-index: 10;
  }

  .keyboard-hint {
    position: absolute;
    top: 16px;
    left: 16px;
    font-size: 11px;
    color: #555;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="viewer">
  <div class="keyboard-hint">Arrow keys or swipe to navigate. H to toggle hero overlay.</div>
  <button class="toggle-hero" onclick="toggleHero()">Toggle Hero Overlay (H)</button>

  <div class="image-container" id="imageContainer">
    <img id="mainImage" src="" alt="">
    <div class="hero-preview" id="heroPreview">
      <h1>The Reading Room</h1>
      <p>Ask the Librarian about any text in the collection — alchemy, Hermetica, Kabbalah, astrology, natural philosophy.</p>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">&#8592; Previous</button>
    <div class="info">
      <div class="counter" id="counter"></div>
      <div class="label" id="label"></div>
      <div class="source" id="source"></div>
      <div id="categoryBadge"></div>
    </div>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)">Next &#8594;</button>
  </div>
</div>

<script>

  },

    label: "Bookshop Interior",

  },
  {

    label: "Scholar in Study",

    category: "collection"
  },
  {

  },

    label: "Athanasius Kircher in Library",

  },
  {
    url: "https://images.sourcelibrary.org/gallery/6953e28477f38f6761be9922/6953e28477f38f6761be999b-0.jpg?v=1771876338032",

  {
    url: "https://mule-router-assets.muleusercontent.com/router_public/production/ephemeral/df40baa5-e2b1-4ea2-84e9-fe6bc1686acf/result_01.png",

    category: "generated"
  },
  {
    url: "https://mule-router-assets.muleusercontent.com/router_public/production/ephemeral/df40baa5-e2b1-4ea2-84e9-fe6bc1686acf/result_02.png",
    label: "Librarian Figure (C) — for compositing",
    source: "AI Generated — dark bg for removal",
    category: "generated"
  },
  {
    url: "https://mule-router-assets.muleusercontent.com/router_public/production/ephemeral/df40baa5-e2b1-4ea2-84e9-fe6bc1686acf/result_03.png",
    label: "Librarian Figure (D) — for compositing",
    source: "AI Generated — dark bg for removal",
    category: "generated"
  },
];

let current = 0;
let heroVisible = false;

function render() {
  const img = images[current];
  document.getElementById('mainImage').src = img.url;
  document.getElementById('counter').textContent = `${current + 1} / ${images.length}`;
  document.getElementById('label').textContent = img.label;
  document.getElementById('source').textContent = img.source;
  document.getElementById('categoryBadge').innerHTML =
    `<span class="category ${img.category === 'collection' ? 'cat-collection' : 'cat-generated'}">${img.category === 'collection' ? 'FROM COLLECTION' : 'AI GENERATED'}</span>`;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === images.length - 1;
}

function navigate(dir) {
  current = Math.max(0, Math.min(images.length - 1, current + dir));
  render();
}

function toggleHero() {
  heroVisible = !heroVisible;
  document.getElementById('heroPreview').classList.toggle('visible', heroVisible);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'h' || e.key === 'H') toggleHero();
});

// Touch swipe
let touchStartX = 0;
document.getElementById('imageContainer').addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
});
document.getElementById('imageContainer').addEventListener('touchend', (e) => {
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 50) navigate(diff > 0 ? 1 : -1);
});

render();
</script>
</body>
</html>
