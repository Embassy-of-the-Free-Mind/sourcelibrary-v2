<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Source Library Embed — Local Test</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: #fafaf8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .bar { padding: 12px 20px; background: #1a1a1a; color: #ccc; font-size: 12px; display: flex; align-items: center; gap: 16px; }
    .bar strong { color: #fff; }
    .bar code { background: #333; border-radius: 3px; padding: 1px 6px; font-family: monospace; color: #f0c97a; }
    .bar a { color: #8b6914; text-decoration: none; margin-left: auto; font-size: 11px; }
    .bar a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <!-- Dev info bar — not part of the embed itself -->
  <div class="bar">
    <strong>SL Embed Test</strong>
    collection: <code id="cfg-collection"></code>
    height: <code id="cfg-height"></code>
    base-url: <code id="cfg-base"></code>
    <a href="http://localhost:3000" target="_blank">Open Source Library →</a>
  </div>

  <!-- This is what partners paste into Webflow -->
  <div id="sl-embed"></div>

  <script
    src="/embed/v1.js"
    data-collection="alchemy"
    data-target="sl-embed"
    data-height="calc(100vh - 38px)"
    data-base-url="http://localhost:3000">
  </script>

  <script>
    var s = document.querySelector('script[data-collection]');
    document.getElementById('cfg-collection').textContent = s.getAttribute('data-collection');
    document.getElementById('cfg-height').textContent = s.getAttribute('data-height');
    document.getElementById('cfg-base').textContent = s.getAttribute('data-base-url');
  </script>
</body>
</html>
