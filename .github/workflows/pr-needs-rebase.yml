name: PR needs-rebase

# Every push to main invalidates the mergeability of every open PR. This job
# re-asks GitHub for each one and labels the conflicting ones `needs-rebase`,
# with ONE comment naming the files that collided and the merges that did it
# (scripts/maintenance/pr-needs-rebase.mjs). The label comes off when the PR
# merges clean again. Informational: changes no tier, blocks nothing.
#
# WHY (#5415): auto-merge.yml never merges a CONFLICTING PR and nothing said so.
# Measured 2026-09-30: 12 of 22 open PRs conflicting, 7 tier:auto opened that
# day; 32 PRs since August closed by stale sweeps instead of finished.
#
# The 30-minute schedule is a backstop for pushes the push trigger misses
# (workflow-token merges do not fire `push` for other workflows).

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print what would change, label nothing'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-needs-rebase
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Overlap needs the PR branches and main's history since each branch point.
      - run: git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Label conflicting PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/maintenance/pr-needs-rebase.mjs ${{ inputs.dry_run == true && '' || '--apply' }}
