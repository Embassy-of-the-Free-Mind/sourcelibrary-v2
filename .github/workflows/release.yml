name: Release to production

# Production is the `release` branch, not `main` (#7008). A merge to main builds nothing;
# this workflow fast-forwards `release` to main's tip, and Vercel builds that push as the
# production deployment.
#
# Why: Vercel's ISR cache belongs to one deployment, so every production build starts it
# empty. When every merge that touched src/ was a production build (~19 a day in the week to
# 2026-10-19) a cached page lived about an hour and the renders that refilled it were most
# of the Vercel bill (#4753, #3645). Three releases a day keep pages cached ~8 h.
#
# When it runs:
#   - 07:00, 13:00, 19:00 UTC (GitHub may drop a scheduled run under load, #5276;
#     scripts/audit/vercel-prod-watch.mjs pages when production trails main by > 13 h)
#   - by hand, for a reader-facing breakage or a failed scheduled release (#8372):
#       gh workflow run release.yml -f reason="what breaks for readers until the next window"
#     A wish to see a change sooner is what a preview is for.
#   - on a push to main whose SUBJECT line (a squash merge: the PR title) carries [deploy-now] (a hand merge; merges by
#     auto-merge.yml use GITHUB_TOKEN and never trigger push workflows)
#
# What it does: skips if `release` already holds main's tip; runs the entities-sweep interlock
# when build inputs changed (a release IS a prod build; a bulk `entities` writer fails the
# /explore prerender); pushes main's tip to `release` fast-forward only (it never forces);
# then dispatches post-deploy-warm.yml for that commit, because a push made with GITHUB_TOKEN
# does not trigger it. A release with no build-input change leaves `release` where it is
# (`force` ships anyway); every push to `release` builds, because the decision is made here.
#
# Rollback: in Vercel → Settings → Environments → Production, set the branch back to `main`,
# and put `"main": true` back in vercel.json `git.deploymentEnabled`.

on:
  schedule:
    - cron: '0 7,13,19 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'What breaks for readers until the next scheduled release, or which scheduled release failed'
        type: string
        required: true
      force:
        description: 'Release and build even if no build input changed since the last release'
        type: boolean
        default: false

permissions:
  contents: write  # push to release
  actions: write   # dispatch post-deploy-warm.yml

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # On a push, only a SUBJECT line carrying [deploy-now] releases (a squash merge's subject is the
  # PR title). Matching the whole message released #7009 itself, whose body merely described the tag.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.subject.outputs.go }}
    steps:
      - id: subject
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          REASON: ${{ inputs.reason }}
        run: |
          # A build empties the page cache, so a hand release has to say why it cannot wait (#8372).
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ -z "${REASON//[[:space:]]/}" ]; then
              echo "::error::A hand release needs -f reason=\"...\". Otherwise it ships at the next 07:00, 13:00 or 19:00 UTC; a preview shows it sooner."
              exit 1
            fi
            echo "Hand release: $REASON"
          fi
          SUBJECT="${MESSAGE%%$'\n'*}"
          if [ "$EVENT" != push ] || [[ "$SUBJECT" == *"[deploy-now]"* ]]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

  release:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150  # up to 2 h waiting on the interlock
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: What would ship
        id: diff
        env:
          FORCE: ${{ inputs.force }}
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if ! git rev-parse --verify --quiet origin/release >/dev/null; then
            echo "No release branch yet: first release creates it at ${SHA:0:7}."
            echo "build=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git rev-parse origin/release)" = "$SHA" ]; then
            echo "release already at ${SHA:0:7}; nothing to ship."
            echo "build=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/release "$SHA"; then
            echo "::error::release ($(git rev-parse --short origin/release)) is not an ancestor of main. Someone committed to release directly; resolve by hand, this workflow never forces."
            exit 1
          fi
          echo "Shipping $(git rev-list --count origin/release..HEAD) commit(s):"
          git log --oneline origin/release..HEAD | head -50
          node scripts/vercel-ignore-build.mjs --changed-since origin/release | tee /tmp/changed.txt
          if [ "$FORCE" = "true" ]; then
            echo "force: releasing regardless of the diff."
            echo "build=yes" >> "$GITHUB_OUTPUT"
          else
            grep '^build=' /tmp/changed.txt >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.diff.outputs.build == 'yes'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
        if: steps.diff.outputs.build == 'yes'

      # Exit 0 is clear; 1 (a sweep is live) and 2 (UNKNOWN) are not. Retry every 15 min for 2 h.
      - name: Entities-sweep interlock
        if: steps.diff.outputs.build == 'yes'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          for i in $(seq 1 9); do
            if node scripts/audit/entities-sweep-active.mjs; then echo "interlock clear"; exit 0; fi
            echo "interlock not clear (attempt $i of 9)"
            [ "$i" -lt 9 ] && sleep 900
          done
          echo "::error::entities-sweep interlock not clear after 2 h; release not pushed."
          exit 1

      - name: Fast-forward release
        if: steps.diff.outputs.build == 'yes'
        env:
          SHA: ${{ steps.diff.outputs.sha }}
        # Retries a GitHub server error only (#8120: on 2026-11-04 three releases died on a 500
        # and waited for a hand re-dispatch). The push is a fast-forward, so a failed attempt
        # changes nothing and a retry is safe. A rejection (non-fast-forward, protected ref) is
        # not retried: it fails at once, and the last failure pages through "Page on failure".
        run: |
          for wait in 15 30 60 0; do
            if out=$(git push origin "$SHA:refs/heads/release" 2>&1); then echo "$out"; exit 0; fi
            echo "$out"
            if ! grep -qiE 'error: 5[0-9][0-9]|HTTP 5[0-9][0-9]|internal server error|bad gateway|service unavailable|gateway time-?out|RPC failed' <<<"$out"; then
              echo "::error::push to release refused (not a server error); not retrying."
              exit 1
            fi
            [ "$wait" = 0 ] && break
            echo "::warning::GitHub server error on push; retrying in ${wait}s"
            sleep "$wait"
          done
          echo "::error::push to release failed with a server error 4 times."
          exit 1

      - name: Warm after the build
        if: steps.diff.outputs.build == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.diff.outputs.sha }}
        run: gh workflow run post-deploy-warm.yml --ref main -f sha="$SHA"

      - name: Page on failure
        if: failure()
        run: |
          curl -s -H "Title: Release to production failed" -H "Priority: high" -H "Tags: rocket" \
            -d "release.yml run ${{ github.run_id }} failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            https://ntfy.sh/sourcelibrary-uptime || true
