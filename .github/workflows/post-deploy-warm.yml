name: Post-deploy cache warm

# Runs after a push to main that changes app files (i.e., triggers a Vercel deploy).
# Waits for that deploy to actually be live, then warms the top pages so the new
# deployment's ISR cache is populated instead of waiting for organic traffic.
#
# It no longer purges Cloudflare (#4753). The purge existed for one reason: stale HTML
# pointing at asset hashes the new build deleted. Skew Protection keeps the old build's
# assets for 48h (`skewProtectionMaxAge` 172800, a Vercel project setting), longer than
# the edge TTL (CDN-Cache-Control max-age 86400 + swr 3600), so cached HTML stays styled.
# Meanwhile `purge_everything` ran on every production deploy, ~19 a day in the week to
# 2026-10-06, so Cloudflare's copy lived ~75 minutes and only 15% of requests that passed
# the WAF were served from it. Vercel's ISR cache is per deployment and empties on every
# deploy anyway; Cloudflare is the only cache that can survive one, so we let it.
#
# INVARIANT: skew max-age must stay greater than the edge TTL. If either moves, read
# .claude/docs/invariants/deploy-and-caching.md before touching this file. Content that
# must show at once after a deploy: purge those URLs (see the emergency purge in that doc).
#
# ORDER STILL MATTERS for the warm: warming before the new deployment is live fills the
# cache with the outgoing build. So the wait below polls for a real signal.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'next.config.ts'
      - 'vercel.json'
      - 'package.json'
      - 'package-lock.json'
  # A merge made by auto-merge.yml uses GITHUB_TOKEN, and pushes made with that
  # token never trigger `push` workflows (GitHub's recursion guard). So the
  # auto-merger dispatches this workflow explicitly with the merge commit's SHA.
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit whose production deploy to wait for (default: the ref this ran on)'
        required: false
        type: string

permissions:
  deployments: read
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      # Wait for the deploy of THIS commit to actually be live.
      #
      # This step used to be `sleep 180`, which is a guess, not a wait. Observed
      # 2026-08-06 (#3658): the build took 6 minutes, so the purge and warm below
      # ran three minutes before the new deployment existed, re-warming the edge
      # with the OLD deployment's HTML (the purge is gone since #4753; the warm
      # still needs the new deployment to be live to be worth anything).
      #
      # Vercel's GitHub integration posts a deployment status for each commit, so
      # we poll that with the built-in token rather than adding a Vercel API
      # secret. Fails OPEN: if it times out we warm anyway and say so.
      - name: Wait for Vercel deploy
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          for i in $(seq 1 60); do
            STATE=$(gh api "repos/$REPO/deployments?sha=$SHA&per_page=100" \
              --jq '.[].id' 2>/dev/null | while read -r id; do
                gh api "repos/$REPO/deployments/$id/statuses?per_page=100" \
                  --jq '.[] | select(.environment | test("[Pp]roduction")) | .state' 2>/dev/null
              done | grep -m1 -E '^(success|failure|error)$' || true)
            if [ "$STATE" = "success" ]; then
              echo "Production deploy for $SHA is live after $((i * 15))s"
              echo "deploy_ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
              echo "::error::Vercel production deploy for $SHA reported '$STATE' — not warming."
              echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            sleep 15
          done
          echo "::warning::Timed out after 15 min waiting for the production deploy of $SHA. Warming anyway — it may warm the outgoing build."
          echo "deploy_ready=false" >> "$GITHUB_OUTPUT"

      - name: Warm cache
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            https://sourcelibrary.org/api/deploy-warm \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 290)
          echo "Warm endpoint returned: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Cache warming complete"
          else
            echo "Warning: warm endpoint returned $STATUS (non-fatal)"
          fi
