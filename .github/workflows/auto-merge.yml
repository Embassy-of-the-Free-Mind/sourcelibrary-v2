name: Auto-merge tier:auto PRs

# Merges ONE green `tier:auto` PR per run (scripts/maintenance/auto-merge.mjs):
# test + DCO green, next-build not failed, no `blocked`, settled ≥10 min, main quiet ≥8 min (one
# Vercel build at a time), entities-sweep interlock clear. `tier:hold` PRs are
# never touched — a human merges those. Labels come from pr-tier.yml.
#
# To stop a specific PR: add the `blocked` label. To stop everything: disable
# this workflow in the Actions tab.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows: ['Unit & Integration Tests', 'Next build check']
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print what would merge, merge nothing'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write   # to dispatch post-deploy-warm.yml after a merge (a GITHUB_TOKEN push does not trigger it)

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # ≤ 5 to merge + ≤ 10 asleep before booking the next run
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - name: Merge one ready PR
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/maintenance/auto-merge.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}
      # The `schedule` trigger above is best-effort and GitHub drops it under
      # load (2026-09-30: 1 of 60 runs, queue stalled for hours — #5276). When
      # PRs are still waiting, the script says how many minutes until a merge
      # could succeed; sleep that long and dispatch the next run ourselves.
      # workflow_dispatch is one of the events a GITHUB_TOKEN may trigger. The
      # concurrency group keeps at most one run active and one pending.
      - name: Book the next run
        if: steps.merge.outputs.retry_in != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_IN: ${{ steps.merge.outputs.retry_in }}
        run: |
          sleep $(( RETRY_IN * 60 ))
          gh workflow run auto-merge.yml --ref main
