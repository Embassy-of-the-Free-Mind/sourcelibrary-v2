name: E2E Tests

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 6am UTC
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test against'
        required: false
        # Was sourcelibrary-v2.vercel.app, whose reader surface now 308s to the
        # canonical host (src/lib/alias-host-scope.ts). This job is also on a
        # daily cron, so it needs a working default — and since that alias only
        # ever mirrored production, pointing at production is what it has been
        # testing all along, now through the CDN like a real visitor. For a
        # branch, pass the preview deployment URL explicitly.
        default: 'https://sourcelibrary.org'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          BASE_URL: ${{ inputs.base_url || 'https://sourcelibrary.org' }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Create GitHub issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().split('T')[0];

            // Don't create duplicate issues — check for an existing open one
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'e2e-tests',
              state: 'open',
              per_page: 1,
            });
            if (existing.length > 0) {
              // An open tracking issue already exists. Do NOT append a daily
              // "Still failing as of …" comment — that churn emailed every
              // subscriber once a day with zero new signal (24 such comments
              // on #1582 before this change). The daily run still executes and
              // the playwright-report artifact is still attached to this run,
              // so nothing is lost; we just stop the inbox spam. The run page
              // is the source of truth while the issue stays open.
              core.notice(`E2E still failing; tracking issue #${existing[0].number} already open. Suppressing daily comment. Run: ${runUrl}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `E2E tests failed (${date})`,
              body: [
                `## E2E test failure`,
                ``,
                `**Date:** ${date}`,
                `**Run:** ${runUrl}`,
                `**Base URL:** ${process.env.BASE_URL || 'https://sourcelibrary.org'}`,
                ``,
                `Download the \`playwright-report\` artifact from the run for details.`,
                ``,
                `---`,
                `*Auto-created by the E2E test workflow.*`,
              ].join('\n'),
              labels: ['bug', 'e2e-tests'],
            });
        env:
          BASE_URL: ${{ inputs.base_url || 'https://sourcelibrary.org' }}
