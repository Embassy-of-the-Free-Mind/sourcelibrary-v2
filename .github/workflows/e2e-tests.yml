name: E2E Tests

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 6am UTC
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test against'
        required: false
        default: 'https://sourcelibrary.org'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          BASE_URL: ${{ inputs.base_url || 'https://sourcelibrary.org' }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Create GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `E2E tests failed (${date})`,
              body: [
                `## E2E test failure`,
                ``,
                `**Date:** ${date}`,
                `**Run:** ${runUrl}`,
                `**Base URL:** ${process.env.BASE_URL || 'https://sourcelibrary.org'}`,
                ``,
                `Download the \`playwright-report\` artifact from the run for details.`,
                ``,
                `---`,
                `*Auto-created by the E2E test workflow.*`,
              ].join('\n'),
              labels: ['bug', 'e2e-tests'],
            });
        env:
          BASE_URL: ${{ inputs.base_url || 'https://sourcelibrary.org' }}
