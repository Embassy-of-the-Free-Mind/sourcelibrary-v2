name: Regenerate eval ledgers on main

# scripts/eval/EXPERIMENTS.md, scripts/eval/experiments/index.json (#5939) and
# scripts/eval/INDEX.md are GENERATED files that PRs must not touch (#5436). Their sources are scripts/eval/experiments/*.md (one
# file per experiment) and the eval scripts' docstrings. After every push to main
# that changes a source, this job rebuilds both and commits the result to main as
# the actions bot. PRs therefore add files and never conflict on the ledger.
#
# Why a bot commit is safe here:
#   - the commit touches only scripts/eval/*.md; Vercel's `ignoreCommand`
#     (vercel.json) skips builds for paths outside src/ public/ next.config.ts
#     vercel.json package*.json, so no deploy and no warm;
#   - a GITHUB_TOKEN push does not trigger other workflows, so no cascade;
#   - a rejected push (another merge landed first) is left alone: the next push
#     to main runs this job again.
# The content is a pure function of the tree, so there is nothing to review.

# TRIGGERS. `push` fires only for merges a human made: auto-merge.yml merges with
# the workflow token, and a GITHUB_TOKEN push triggers no workflows (measured
# 2026-10-01: #5390 auto-merged with an EXPERIMENTS.md edit and this job never
# ran). So auto-merge.mjs dispatches this workflow after any merge that touched
# scripts/eval/, and the half-hourly schedule is the backstop for a dropped
# dispatch. A run that finds nothing to do exits in ~15 s.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/eval/**'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eval-ledgers-regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild EXPERIMENTS.md, experiments/index.json and INDEX.md
        run: |
          node scripts/eval/build-experiments.mjs
          node scripts/eval/build-index.mjs

      # The build may also ADOPT an entry a pre-#5436 PR still wrote into
      # EXPERIMENTS.md, creating a new file under experiments/ — commit that too,
      # or the source is lost and the next run adopts it again.
      - name: Commit if anything changed
        run: |
          git add -A -- scripts/eval/EXPERIMENTS.md scripts/eval/INDEX.md scripts/eval/experiments
          if git diff --cached --quiet; then
            echo "ledgers already current"; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m "chore(eval): regenerate EXPERIMENTS.md / INDEX.md from sources (#5436)" \
            -m "Generated by eval-ledgers-regenerate.yml after ${GITHUB_SHA}. Pure function of the tree; nothing to review."
          # Another merge may have landed since checkout; then this run's result is stale
          # and the next push regenerates. Never force.
          git push origin HEAD:main || echo "push rejected — main moved; the next push to main regenerates"
