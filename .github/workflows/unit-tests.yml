name: Unit & Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run unit & integration tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      # `node --check` validates syntax, not scope; tsc does not cover plain
      # .mjs. This is the only guard against an undeclared identifier in the
      # 1,100+ scripts that run against production Mongo (#4702). It uses its
      # own config on purpose: eslint.config.mjs loads eslint-config-next's
      # TypeScript layer, which crashes on load under the lockfile's ESLint 10.
      - name: Lint plain-node scripts (no-undef)
        run: npx eslint -c eslint.scripts.config.mjs "scripts/**/*.mjs" --quiet

      # scripts/eval/EXPERIMENTS.md and INDEX.md are generated on main after merge
      # (eval-ledgers-regenerate.yml, #5436). A PR that hand-edits one re-creates
      # the append-to-one-tail conflict that blocked 6 of 11 PRs on 2026-10-01; a
      # PR that regenerates one correctly is allowed but told it was unnecessary.
      - name: Generated eval ledgers untouched
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/audit/append-only-ledgers.mjs --pr ${{ github.event.pull_request.number }}

      # Every NEW experiment write-up carries the header the index and the public
      # pages read (status, verdict, measure …; schema in experiments/README.md,
      # #5939). Older entries are grandfathered until the backfill lands; any header
      # present must be valid.
      - name: Experiment headers valid
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/eval/experiments-lint.mjs --pr ${{ github.event.pull_request.number }}

      # Static source check — no network, no secrets — so it gates PRs here
      # rather than running nightly. Vercel Blob is retired in favour of R2
      # (#3645); this refuses new hardcoded Blob URLs (plain OR percent-encoded)
      # and new direct `@vercel/blob` imports that bypass storagePut().
      - name: No new Vercel Blob dependencies
        run: node scripts/audit/no-vercel-blob.mjs

      # The generated routing table (.claude/docs/ocr-engine-routing.md) against the live
      # routing constants (#5871). Class (c) of scripts/audit/routing-drift.mjs only: the
      # other classes compare the code with the decisions ledger and are filed as issues by
      # the daily cron, never failed on a PR. Exit 2 (could not run) fails the step too.
      - name: Generated routing table is current
        run: node scripts/audit/routing-drift.mjs --ci
