name: Unit & Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run unit & integration tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      # Static source check — no network, no secrets — so it gates PRs here
      # rather than running nightly. Vercel Blob is retired in favour of R2
      # (#3645); this refuses new hardcoded Blob URLs (plain OR percent-encoded)
      # and new direct `@vercel/blob` imports that bypass storagePut().
      - name: No new Vercel Blob dependencies
        run: node scripts/audit/no-vercel-blob.mjs
